# softwary test-skip markers. This file belongs to the project: softwary
# never overwrites it.
#
# `./softwary guard` reports every line a job adds under test_paths that
# matches one of these patterns: the markers of your test framework that skip
# a test or focus a run on some tests. One extended regular expression per
# line; blank lines and lines starting with '#' are ignored.
#
# Add the patterns of your framework (the setup skill asks for them). If the
# project has no test framework yet, replace the patterns with one line:
#   NONE: <reason>
