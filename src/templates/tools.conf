# softwary tool targets. This file belongs to the project:
# softwary never overwrites it.
#
# One `tool = value` per line, for every script in .softwary/targets/:
#   on      ./softwary sync generates this tool's files
#   off     no files for this tool (existing generated ones are removed)
#   UNSET   not chosen yet; sync and verify fail until it is on or off

claude-code = UNSET
codex = UNSET
cursor = UNSET
