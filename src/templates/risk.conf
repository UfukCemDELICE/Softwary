# softwary risk tiers by path. One `<glob> = R1|R2|R3` per line.
# A glob is a shell pattern matched against repo-relative paths; '*' also
# matches '/'. A changed path takes the highest tier of the globs it matches,
# or `default` when it matches none. `default` is required.
#   R1 low: skim the summary. R2 normal: read the summary and flagged files.
#   R3 critical: read every line; no automatic merge.
# Example:
#   src/auth/* = R3
default = UNSET
