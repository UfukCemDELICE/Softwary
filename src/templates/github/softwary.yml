# softwary CI. Copy this file to .github/workflows/softwary.yml, then replace
# every UNSET: the pull_request branches with the integration branch and the
# production branch (integration_branch and production_branch in
# .softwary/config/commands.conf: the pull request that takes the integration
# branch to production is verified too), the push branch with the integration
# branch, and the install step with the commands that install the tools
# commands.conf uses. ./softwary doctor reports each UNSET until then.
name: softwary
on:
  pull_request:
    branches: [UNSET, UNSET]
  push:
    branches: [UNSET]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Java (the TLA+ model checker needs it)
        if: ${{ hashFiles('architecture/formal/*.tla') != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the TLA+ tools
        if: ${{ hashFiles('architecture/formal/*.tla') != '' }}
        run: ./softwary formal install
      - name: Install tools
        run: UNSET # replace with the commands that install the tools commands.conf uses
      - name: Verify the pull request against its base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./softwary verify --base "origin/$BASE_REF"
      - name: Verify
        if: github.event_name == 'push'
        run: ./softwary verify
