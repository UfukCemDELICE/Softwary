# softwary loop limits. This file belongs to the project: softwary never
# overwrites it. One `key = value` per line.
#
# The limits of ./softwary run and job. When one is exceeded the job stops and
# is handed to the human with the limit that was hit.
#   max_rounds       implement-gate-review rounds a job may take
#   max_job_minutes  wall-clock minutes a job may take
#   max_run_minutes  wall-clock minutes a run may take
#   concurrency      jobs at the same time (1 until parallel jobs arrive)
#   max_job_tokens   tokens a job may use; a number or `NONE: <reason>`
#   max_run_tokens   tokens a run may use; a number or `NONE: <reason>`
#   min_catch_percent  the share (0-100) of the evaluation's broken changes
#                    the reviewer must catch for merge to merge by itself;
#                    below it, or without a current evaluation, a human merges
# The token limits start UNSET: choose them (ask what the human can spend)
# before the first run; doctor fails until you do.
max_rounds = 3
max_job_minutes = 45
max_run_minutes = 240
concurrency = 1
max_job_tokens = UNSET
max_run_tokens = UNSET
min_catch_percent = 90
