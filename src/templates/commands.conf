# softwary command contract. This file belongs to the project:
# softwary never overwrites it.
#
# One `key = value` per line. A value is one of:
#   a shell command    run from the repo root; passes when it exits 0
#   UNSET              not configured yet; an error for required keys
#   NONE: <reason>     skipped on purpose; the reason appears in reports

# Required
format_check = UNSET
lint = UNSET
typecheck = UNSET
test = UNSET
build = UNSET
security = UNSET

# Branches: verify, adr, changes and risk compare a change with the
# integration branch; the production branch receives releases.
integration_branch = UNSET
production_branch = UNSET

# Optional checks, run by verify when set. model_check is required as soon as
# architecture/formal/ has a specification: set it to ./softwary formal check.
# model_check = ./softwary formal check
# contract_check = <command>
# arch_check = <command>

# Scoped checks. A check that fails and has a waiver (waivers.conf) is run
# again on the files the change touches under src_paths and test_paths, and
# must pass there: ./softwary verify --base, the job's gate and the merge do
# it. <key>_files is that command, with {files} where the files go (quoted,
# blank-separated), or NONE: <reason>. A waiver needs it: doctor and
# ./softwary run start fail without it.
# format_check_files = <command with {files}>
# lint_files = <command with {files}>
# typecheck_files = <command with {files}>
# test_files = <command with {files}>
# build_files = <command with {files}>
# security_files = <command with {files}>
# model_check_files = <command with {files}>
# contract_check_files = <command with {files}>
# arch_check_files = <command with {files}>

# Required by the loop (./softwary run start): prepares a fresh worktree of a
# job (install dependencies, build what the checks need), run there once.
# `NONE: <reason>` when the project needs nothing.
bootstrap = UNSET

# Optional commands, not run by verify
# run = <command>
# deploy = <command>
