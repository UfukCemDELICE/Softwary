# softwary command contract. This file belongs to the project:
# softwary never overwrites it.
#
# One `key = value` per line. A value is one of:
#   a shell command    run from the repo root; passes when it exits 0
#   UNSET              not configured yet; an error for required keys
#   NONE: <reason>     skipped on purpose; the reason appears in reports

# Required
format_check = UNSET
lint = UNSET
typecheck = UNSET
test = UNSET
build = UNSET
security = UNSET

# Branches: verify, adr, changes and risk compare a change with the
# integration branch; the production branch receives releases.
integration_branch = UNSET
production_branch = UNSET

# Optional checks, run by verify when set
# contract_check = <command>
# arch_check = <command>

# Required by the loop (./softwary run start): prepares a fresh worktree of a
# job (install dependencies, build what the checks need), run there once.
# `NONE: <reason>` when the project needs nothing.
bootstrap = UNSET

# Optional commands, not run by verify
# run = <command>
# deploy = <command>
