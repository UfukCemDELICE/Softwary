# softwary models by subagent. This file belongs to the project: softwary
# never overwrites it. One `agent = model` per line, for every installed
# subagent (the managed ones and those under .softwary/local/agents/).
#
# ./softwary sync writes the model into the Claude Code subagent files; the
# other tools ignore it. The reviewer and the approver must not use the
# implementer's model: a model reviewing its own kind of work agrees too easily.
spec-analyst = opus
implementer = sonnet
advisor = opus
reviewer = opus
approver = opus
blueprint-critic = opus
