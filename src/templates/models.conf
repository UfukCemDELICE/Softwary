# softwary models by subagent. This file belongs to the project: softwary
# never overwrites it. One `agent = class` per line, for every installed
# subagent (the managed ones and those under .softwary/local/agents/). The
# class is a short name for a kind of model, such as opus or sonnet.
#
# ./softwary sync writes the model into the subagent files of the tools that
# are on in tools.conf. Claude Code reads the class as a model name. Cursor and
# Codex need the model id each class has in them: one line per tool and class,
#
#   cursor: opus = <model id of your Cursor account>
#   cursor: sonnet = <model id>
#   codex: opus = <model id of your Codex account>
#   codex: sonnet = <model id>
#
# (Cursor accepts options in brackets, such as claude-opus-5[effort=high].) A
# class with no line for a tool that is on is a problem that doctor reports and
# that stops `run start`. Claude Code needs such a line only to use another id
# than the class name (`claude-code: opus = <model id>`).
#
# The reviewer and the approver must not use the implementer's model, in any
# tool that is on: a model reviewing its own kind of work agrees too easily.
# doctor compares the model ids after the translation, tool by tool.
spec-analyst = opus
implementer = sonnet
advisor = opus
reviewer = opus
approver = opus
blueprint-critic = opus
