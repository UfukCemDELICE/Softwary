# softwary waivers. This file belongs to the project: softwary never
# overwrites it.
#
# A waiver lets a failing project check pass verify until a date, with a
# reason that every report shows. One per line:
#   <key> = <YYYY-MM-DD>: <reason>
# <key> is a check verify runs (format_check, lint, typecheck, test, build,
# contract_check, arch_check, security). The package's own checks cannot be
# waived. After the date the check fails again.
